name: PC RFCOMM offline

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/pc-rfcomm/**'
      - 'tools/pc-rfcomm.mjs'
      - 'tools/pc-rfcomm-supervisor.mjs'
      - 'tools/test-pc-rfcomm-supervisor.mjs'
      - 'tools/pc-rfcomm-session.mjs'
      - 'tools/pc-rfcomm-auth-prepare.mjs'
      - 'tools/rw4-xiaomi-protocol.mjs'
      - 'tools/test-rw4-xiaomi-session.mjs'
      - 'tools/static-watchface-*.mjs'
      - 'tools/pc-static-watchface.mjs'
      - 'tools/test-static-watchface-gates.mjs'
      - 'tools/pc-pairing.mjs'
      - 'tools/test-pc-pairing.mjs'
      - '.github/workflows/pc-rfcomm-offline.yml'
  pull_request:
    paths:
      - 'experiments/pc-rfcomm/**'
      - 'tools/pc-rfcomm.mjs'
      - 'tools/pc-rfcomm-supervisor.mjs'
      - 'tools/test-pc-rfcomm-supervisor.mjs'
      - 'tools/pc-rfcomm-session.mjs'
      - 'tools/pc-rfcomm-auth-prepare.mjs'
      - 'tools/rw4-xiaomi-protocol.mjs'
      - 'tools/test-rw4-xiaomi-session.mjs'
      - 'tools/static-watchface-*.mjs'
      - 'tools/pc-static-watchface.mjs'
      - 'tools/test-static-watchface-gates.mjs'
      - 'tools/pc-pairing.mjs'
      - 'tools/test-pc-pairing.mjs'
      - '.github/workflows/pc-rfcomm-offline.yml'

permissions:
  contents: read

jobs:
  simulated-client:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile own offline client
        shell: pwsh
        run: node tools/pc-rfcomm.mjs build
      - name: Test lifecycle and default physical boundary
        shell: pwsh
        run: node tools/pc-rfcomm.mjs test
      - name: Test worker supervision without radio
        shell: pwsh
        run: node tools/test-pc-rfcomm-supervisor.mjs
      - name: Test Xiaomi batch against synthetic peers
        shell: pwsh
        run: node tools/test-rw4-xiaomi-session.mjs
      - name: Verify static watchface physical entries remain closed
        shell: pwsh
        run: node tools/test-static-watchface-gates.mjs
      - name: Test directed pairing supervision without radio
        shell: pwsh
        run: node tools/test-pc-pairing.mjs
