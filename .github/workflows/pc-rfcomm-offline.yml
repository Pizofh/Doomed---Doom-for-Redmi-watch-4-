name: Offline validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lua interpreter from Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
      - name: Test launcher controller and UI with synthetic dependencies
        run: lua5.4 experiments/doom-runtime-rw4/launcher-tests-r282.lua
      - name: Test memory parser, bounded I/O and one-snapshot UI
        run: lua5.4 experiments/memory-preflight/tests.lua

  publish-audit:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit reachable history for excluded assets and credential patterns
        run: node tools/audit-git-publish.mjs
      - name: Validate curated public source snapshot and guide links
        run: node tools/export-public-source.mjs

  large-file-model:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test offline consumer preparer with synthetic game data
        run: node --test tools/test-delivery-preparer.mjs tools/test-delivery-configuration.mjs
      - name: Test large upload and ambiguous delivery with owned synthetic data
        run: node tools/test-doom-large-upload.mjs --synthetic
      - name: Test authenticated large session, journal, resume and catalog with PC peer
        run: node tools/test-doom-upload-pc-session.mjs

  simulated-client:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Compile own offline client
        shell: pwsh
        run: node tools/pc-rfcomm.mjs build
      - name: Test lifecycle and default physical boundary
        shell: pwsh
        run: node tools/pc-rfcomm.mjs test
      - name: Test compiled large-file IPC and supervisor without radio
        shell: pwsh
        run: node tools/test-doom-large-worker.mjs
      - name: Test worker supervision without radio
        shell: pwsh
        run: node tools/test-pc-rfcomm-supervisor.mjs
      - name: Test Xiaomi batch against synthetic peers
        shell: pwsh
        run: node tools/test-rw4-xiaomi-session.mjs
      - name: Verify image and Lua watchface physical entries remain closed
        shell: pwsh
        run: node tools/test-static-watchface-gates.mjs
      - name: Test directed pairing supervision without radio
        shell: pwsh
        run: node tools/test-pc-pairing.mjs
